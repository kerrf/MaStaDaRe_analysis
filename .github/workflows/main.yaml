name: CI/CD Pipeline

# 1. Triggers: When should this run?
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ==========================================
  # BACKEND CI: FastAPI
  # ==========================================
  backend-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12" # Project requires >=3.12 (pyproject.toml)

      - name: Install Dependencies
        run: uv sync --frozen

      - name: Run Linter (Ruff)
        # Non-blocking: there's existing lint debt across the codebase not yet
        # cleaned up. Still runs so issues are visible in the log.
        run: uv run ruff check backend
        continue-on-error: true

      - name: Run Tests (Pytest)
        run: uv run pytest backend

  # ==========================================
  # FRONTEND CI: React
  # ==========================================
  frontend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend # Run all steps in the frontend folder

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20" # Match your project's version
          cache: "npm"
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        # Non-blocking: there's existing lint debt (mostly missing PropTypes)
        # not yet cleaned up. Still runs so issues are visible in the log.
        run: npm run lint
        continue-on-error: true

      - name: Build React App
        run: npm run build

  # ==========================================
  # CONTINUOUS DEPLOYMENT (CD)
  # ==========================================
  deploy:
    # Only run deployment if both CI jobs pass AND it's a push to main.
    # Vercel deploys the frontend on its own via its GitHub integration —
    # nothing to do here for that. This job only redeploys the backend.
    needs: [backend-ci, frontend-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy backend to netcup
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.NETCUP_HOST }}
          username: ${{ secrets.NETCUP_SSH_USER }}
          key: ${{ secrets.NETCUP_SSH_KEY }}
          script: |
            cd ${{ secrets.NETCUP_DEPLOY_PATH }}
            git pull origin main
            docker compose up -d --build backend caddy
