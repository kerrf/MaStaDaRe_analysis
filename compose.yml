services:
  db:
    image: postgis/postgis:16-3.4
    container_name: mastr_db
    restart: always
    environment:
      POSTGRES_DB: mastr
      POSTGRES_USER: mastr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mastr}
    ports:
      - "127.0.0.1:5432:5432" # Forces it to bind to IPv4 specifically
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mastr -d mastr"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mastr_backend
    restart: always
    env_file:
      - backend/.env.production
    volumes:
      - ./backend/data:/app/data
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    container_name: mastr_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
