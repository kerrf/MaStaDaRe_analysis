[project]
name = "mastadatregpv-korrekt-main"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alive-progress>=3.3.0",
    "asyncpg>=0.31.0",
    "beautifulsoup4>=4.14.3",
    "dotenv>=0.9.9",
    "fastapi>=0.135.3",
    "geopandas>=1.1.3",
    "itables>=2.7.3",
    "lxml>=6.0.2",
    "matplotlib>=3.10.8",
    "pandas==2.3.3",
    "psycopg2-binary>=2.9.12",
    "psycopg[binary]>=3.3.3",
    "pyarrow>=23.0.1",
    "pydantic-settings>=2.15.0",
    "requests>=2.33.1",
    "scipy>=1.17.1",
    "sqlalchemy>=2.0.48",
    "uvicorn>=0.42.0",
    "zeep>=4.3.3",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "zizmor>=1.30.1",
]

[tool.ruff]
line-length = 120
# Notebooks are scratch work, not checked
extend-exclude = ["notebooks", "*.ipynb"]

[tool.ruff.lint]
# Pinned on purpose: ruff's own default set grows with its versions, which would turn the pipeline red after an update
# E4/E7/E9 + F: errors and real bugs (undefined names, unused imports); B: likely bugs; UP: modern syntax;
# I: import order; SIM, C4: simpler code; S: security (Bandit: SQL built from strings, requests without a timeout,
# passwords in the code, unsafe subprocess and deserialisation)
select = ["E4", "E7", "E9", "F", "B", "UP", "I", "SIM", "C4", "S"]
# B905 (zip without strict=): strict=True would change how the ETL behaves on uneven lists
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
# Tests check with assert
"backend/tests/**" = ["S101"]
# The ETL builds SQL from the names of its tables and columns (code and schema, never input); values go in as bound
# parameters. The API stays checked: there a query built from strings would be an injection.
"backend/app/etl/**" = ["S608"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's way of declaring parameters, not a bug
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

[tool.pytest.ini_options]
testpaths = ["backend"]
